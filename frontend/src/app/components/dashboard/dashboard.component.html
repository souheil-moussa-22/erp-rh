<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="app-sidenav" [fixedInViewport]="true" fixedTopGap="64">
    <mat-nav-list>
      <a mat-list-item routerLink="/employees" routerLinkActive="active-link" *ngIf="canViewEmployees">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Employees</span>
      </a>

      <a mat-list-item routerLink="/roles" routerLinkActive="active-link" *ngIf="canViewRoles">
        <mat-icon matListItemIcon>manage_accounts</mat-icon>
        <span matListItemTitle>Roles</span>
      </a>

      <a mat-list-item routerLink="/jobs" routerLinkActive="active-link" *ngIf="canViewJobs">
        <mat-icon matListItemIcon>work</mat-icon>
        <span matListItemTitle>Job Offers</span>
      </a>

      <a mat-list-item routerLink="/formations" routerLinkActive="active-link" *ngIf="canViewFormations">
        <mat-icon matListItemIcon>school</mat-icon>
        <span matListItemTitle>Formations</span>
      </a>

      <mat-divider></mat-divider>

      <a mat-list-item routerLink="/my-profile" routerLinkActive="active-link">
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle>My Profile</span>
      </a>

      <a mat-list-item routerLink="/my-leave" routerLinkActive="active-link">
        <mat-icon matListItemIcon>event_available</mat-icon>
        <span matListItemTitle>My Leave</span>
      </a>

      <a mat-list-item routerLink="/conges/my-requests" routerLinkActive="active-link" *ngIf="canViewConges">
        <mat-icon matListItemIcon>list_alt</mat-icon>
        <span matListItemTitle>My Requests</span>
      </a>

      <a mat-list-item routerLink="/conges/submit" routerLinkActive="active-link" *ngIf="canSubmitConges">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>New Request</span>
      </a>

      <a mat-list-item routerLink="/conges/manage" routerLinkActive="active-link" *ngIf="canManageConges">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matListItemTitle>Manage Requests</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Chatbot popup -->
@if (showChatbot) {
  <div class="chatbot-popup-wrapper">
    <app-chatbot (close)="toggleChatbot()"></app-chatbot>
  </div>
}

<!-- Chatbot bubble button -->
<button class="chatbot-bubble" mat-fab color="primary" (click)="toggleChatbot()" matTooltip="AI Assistant">
  <mat-icon>chat</mat-icon>
  @if (hasNewMessages) {
    <span class="chatbot-notification">●</span>
  }
</button>
