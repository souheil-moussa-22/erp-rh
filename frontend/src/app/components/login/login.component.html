<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header class="auth-header">
      <div class="logo-section">
        <mat-icon class="logo-icon">business</mat-icon>
        <span class="logo-text">HR VISION</span>
      </div>
      <mat-card-title>Sign In</mat-card-title>
      <mat-card-subtitle>Access your personal space</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="errorMessage" class="error-banner">
        <mat-icon>error_outline</mat-icon>
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="your@email.com">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Your password">
          <mat-icon matPrefix>lock</mat-icon>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="submit-btn"
          [disabled]="loginForm.invalid || isLoading">
          @if (isLoading) {
            <mat-spinner diameter="20"></mat-spinner>
            <span>Signing in...</span>
          } @else {
            <ng-container>
              <mat-icon>login</mat-icon>
              <span>Sign In</span>
            </ng-container>
          }
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="auth-footer">
      <p>Forgot your password?
        <a routerLink="/forgot-password" mat-button color="primary">Reset password</a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
